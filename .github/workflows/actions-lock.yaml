name: actions-lock
on:
  pull_request:
    paths:
    - ".github/workflows/**"
    - "**/action.yml"
    - "**/action.yaml"
  push:
    branches:
    - main
    paths:
    - ".github/workflows/**"
    - "**/action.yml"
    - "**/action.yaml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: checkout
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: install actions-lock
      run: gh extension install github/gh-actions-lock --pin v0.2.0
      env:
        GH_TOKEN: ${{ github.token }}
    - name: verify workflow dependencies
      run: gh actions-lock --verify
      env:
        GH_TOKEN: ${{ github.token }}
