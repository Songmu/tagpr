baseURL: https://junkyard.song.mu/tagpr/
title: tagpr
defaultContentLanguage: en
languages:
  en:
    label: English
    locale: en-US
    weight: 1
    params:
      description: A GitHub Action for automated release pull requests and tagging
  ja:
    label: 日本語
    locale: ja-JP
    weight: 2
    params:
      description: リリースプルリクエストとタグ付けを自動化する GitHub Action
enableRobotsTXT: true
disableKinds:
- taxonomy
- term

module:
  hugoVersion:
    extended: true
    min: 0.165.0
  imports:
  - path: github.com/imfing/hextra

markup:
  goldmark:
    parser:
      attribute:
        block: true
    renderer:
      unsafe: false
  highlight:
    noClasses: false

menu:
  main:
  - name: Search
    weight: 1
    params:
      type: search
  - name: Language
    weight: 2
    params:
      type: language-switch
  - name: GitHub
    weight: 3
    url: https://github.com/Songmu/tagpr
    params:
      icon: github

params:
  navbar:
    displayTitle: true
    displayLogo: false
  theme:
    default: system
    displayToggle: true
